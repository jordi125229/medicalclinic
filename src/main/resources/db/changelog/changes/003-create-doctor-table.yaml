databaseChangeLog:
  - changeSet:
      id: 003-create-doctor-table
      author: jordi1225
      comment: "Doctor table creation"
      changes:
        - createTable:
            tableName: Doctor
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
              - column:
                  name: last_name
                  type: VARCHAR(100)
              - column:
                  name: specialization
                  type: VARCHAR(100)
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true


