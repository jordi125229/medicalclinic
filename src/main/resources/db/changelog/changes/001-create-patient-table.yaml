databaseChangeLog:
  - changeSet:
      id: 001-create-patients-table
      author: jordi1225
      comment: "Patient table creation"
      changes:
        - createTable:
            tableName: Patient
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: id_card_no
                  type: VARCHAR(50)
              - column:
                  name: first_name
                  type: VARCHAR(100)
              - column:
                  name: last_name
                  type: VARCHAR(100)
              - column:
                  name: phone_number
                  type: VARCHAR(15)
              - column:
                  name: birthday
                  type: DATE