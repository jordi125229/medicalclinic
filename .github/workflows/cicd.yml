name: Medical Clinic CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:

  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and test
        run: mvn -B clean verify
        
  security:
    name: Dependency Security
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -DnvdApiKey="$NVD_API_KEY" \
            -DfailBuildOnCVSS=7

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=medical-clinic \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN"

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [security, sonar]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t medical-clinic:${{ github.sha }} \
            .
  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t medical-clinic:${{ github.sha }} \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: medical-clinic:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
  deploy:
    name: Upload & Deploy
    runs-on: ubuntu-latest
    needs: docker-security

    steps:
      - name: Fake artifact repository upload
        run: |
          echo "Uploading medical-clinic to central artifact repository..."
          echo "Version: ${GITHUB_SHA::7}"
          echo "Upload successful!"

      - name: Fake Docker signing
        run: |
          echo "Signing Docker image..."
          echo "Signature: FAKE-${GITHUB_SHA::12}"

      - name: Fake deployment
        run: |
          echo "Deploying medical-clinic..."
          echo "Deployment successful!"
