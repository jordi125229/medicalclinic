name: Medical Clinic CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:

  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and test
        run: mvn -B clean verify


  security:
    name: Dependency Security
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: OWASP dependency check
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7


  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: SonarQube analysis
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.projectKey=medical-clinic \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}


  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [security, sonar]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t medical-clinic:${GITHUB_SHA::7} .


  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t medical-clinic:${GITHUB_SHA::7} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: medical-clinic:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"


  deploy:
    name: Upload & Deploy
    runs-on: ubuntu-latest
    needs: docker-security

    steps:
      - name: Fake artifact repository upload
        run: |
          echo "Uploading medical-clinic to central artifact repository..."
          echo "Version: ${GITHUB_SHA::7}"
          echo "Upload successful!"

      - name: Fake Docker signing
        run: |
          echo "Signing Docker image..."
          echo "Signature: FAKE-${GITHUB_SHA::12}"

      - name: Fake deployment
        run: |
          echo "Deploying medical-clinic..."
          echo "Deployment successful!"
